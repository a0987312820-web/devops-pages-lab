name: Deploy and Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 嚴格對齊作業要求：將當前的 Commit SHA 寫入 version.txt
      - name: Generate version file
        run: echo "${{ github.sha }}" > version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for pages CDN to update
        run: sleep 30 # 給予 GitHub Pages CDN 30秒更新快取時間

      - name: Run Strict Version Smoke Test
        run: |
          TARGET_URL="https://a0987312820-web.github.io/devops-pages-lab/version.txt"
          EXPECTED_SHA="${{ github.sha }}-wrong-version-123"
          
          echo "Checking version from: $TARGET_URL"
          # 抓取線上 version.txt 並用 tr 移除前後空白與換行符號
          ONLINE_SHA=$(curl -s "$TARGET_URL" | tr -d '[:space:]')
          
          echo "Online version:  '$ONLINE_SHA'"
          echo "Expected version: '$EXPECTED_SHA'"
          
          if [ "$ONLINE_SHA" = "$EXPECTED_SHA" ]; then
            echo "✅ Smoke test passed! Exact version matches."
          else
            echo "❌ Smoke test failed! Version mismatch."
            exit 1
          fi
