name: Deploy and Smoke Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 關鍵步驟：在建置前將當前的 Commit SHA 寫入 version.txt
      - name: Generate version file
        run: echo ${{ github.sha }} > version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
      runs-on: ubuntu-latest
      needs: deploy
      steps:
        - name: Wait for pages to serve
          run: sleep 15

        - name: Run Smoke Test
          run: |
            # 直接使用你的專案正式網址
            TARGET_URL="https://a0987312820-web.github.io/devops-pages-lab/"
            
            echo "Checking site: $TARGET_URL"
            RESPONSE=$(curl -s $TARGET_URL)
            
            # 檢查網頁內容中是否有包含你的學號 B11309052
            if echo "$RESPONSE" | grep -q "B11309052"; then
              echo "✅ Smoke test passed! Live site is up and content is verified."
            else
              echo "❌ Smoke test failed! Content not found."
              exit 1
            fi
